name: Deploy Frontend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Test production build
        run: npm run build

  deploy:
    name: Deploy to Production Server
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass (for password / keyboard-interactive SSH)
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ]; then
            echo "::error::Missing SERVER_HOST or SERVER_USER secret in GitHub repository settings."
            exit 1
          fi

          # Sanitize accidental whitespace/newlines, URL schemes, or 'ssh user@' prefixes pasted into secrets
          CLEAN_HOST="$(printf '%s' "$SERVER_HOST" | sed -E 's/^ssh[[:space:]]+//i; s#^https?://##i; s#/.*$##; s/^[^@]+@//' | tr -d '[:space:]')"
          CLEAN_USER="$(printf '%s' "$SERVER_USER" | tr -d '[:space:]')"
          CLEAN_PORT="$(printf '%s' "${SERVER_PORT:-22}" | tr -d '[:space:]')"
          CLEAN_PORT="${CLEAN_PORT:-22}"

          if [ -z "$CLEAN_HOST" ] || ! [[ "$CLEAN_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid SERVER_HOST secret format. Set SERVER_HOST to only the IP/domain (e.g. 188.212.99.215)."
            exit 1
          fi

          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            SSH_CMD=(ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p "$CLEAN_PORT" "${CLEAN_USER}@${CLEAN_HOST}")
          elif [ -n "${SERVER_PASSWORD:-}" ]; then
            export SSHPASS="$(printf '%s' "$SERVER_PASSWORD" | tr -d '\r\n')"
            SSH_CMD=(sshpass -e ssh -o PreferredAuthentications=keyboard-interactive,password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -p "$CLEAN_PORT" "${CLEAN_USER}@${CLEAN_HOST}")
          else
            echo "::error::Neither SSH_PRIVATE_KEY nor SERVER_PASSWORD secret is configured."
            exit 1
          fi

          "${SSH_CMD[@]}" 'bash -s' <<'EOF'
            # Load Node / npm PATH in non-interactive SSH sessions before strict nounset
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            if [ -s "$HOME/.profile" ]; then
              . "$HOME/.profile"
            fi

            set -euo pipefail

            # 1. Enter frontend directory
            cd /root/nafis-jewellary

            # 2. Pull latest code from GitHub
            git pull --ff-only origin main

            # 3. Install dependencies and build static export (`out/`)
            npm ci
            rm -rf out
            npm run build

            # Guard: verify build succeeded before touching live web root
            if [ ! -f "out/index.html" ]; then
              echo "Build error: out/index.html not found; aborting deploy."
              exit 1
            fi

            # 4. Replace old site with new static build
            rm -rf /var/www/html/*
            cp -r out/. /var/www/html/
          EOF
