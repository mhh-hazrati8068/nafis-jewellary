name: Deploy Frontend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # ورود به مسیر پروژه
            cd /root/nafis-jewellary
            
            # دریافت آخرین تغییرات از گیت‌هاب
            git pull
            
            # نصب پکیج‌ها در صورت وجود پکیج جدید
            npm install
            
            # بیلد گرفتن از پروژه
            npm run build
            
            # پاک کردن فایل‌های قبلی سایت
            rm -rf /var/www/html/*
            
            # کپی کردن فایل‌های جدید
            cp -r out/* /var/www/html/
