<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10" />
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF9F5" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3E6D" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="4" y="4" width="152" height="172" rx="16" fill="url(#cardGrad)" stroke="#C4852B" stroke-width="1.2" stroke-opacity="0.35" filter="url(#shadow)" />
  
  <!-- Outer Gold Decorative Ring -->
  <circle cx="80" cy="62" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" />
  <circle cx="80" cy="62" r="40" fill="#FFFFFF" stroke="#1A3E6D" stroke-width="1.8" />

  <!-- 5-Pointed Crest Ribbon Pattern -->
  <path d="M80 30 L86 46 L104 46 L90 57 L95 74 L80 63 L65 74 L70 57 L56 46 L74 46 Z" fill="url(#goldGrad)" opacity="0.25" />

  <!-- Central Blue Disc -->
  <circle cx="80" cy="62" r="25" fill="url(#blueGrad)" />

  <!-- Iconic 'e' Symbol -->
  <path d="M70 62 C70 55.5 75 51 81.5 51 C87.5 51 91 55 91 59.5 C91 60.8 90 61.5 88.5 61.5 L73 61.5 C73.5 65.5 77 68.5 81.5 68.5 C84.5 68.5 87 67.5 88.8 66 L90.5 68 C88 70 85 71.5 81 71.5 C74.5 71.5 70 67 70 62 Z M81.5 54 C77.5 54 74.5 56.5 73.5 59.5 L88 59.5 C87.5 56.5 85 54 81.5 54 Z" fill="#FFFFFF" />

  <!-- 5 Golden Stars of Trust -->
  <g fill="url(#goldGrad)" transform="translate(80, 114)">
    <!-- Center Star -->
    <path d="M0 -6 L1.8 -1.8 L6 -1.8 L2.6 1 L3.8 5.2 L0 2.6 L-3.8 5.2 L-2.6 1 L-6 -1.8 L-1.8 -1.8 Z" />
    <!-- Left Star 1 -->
    <path d="M-15 -6 L-13.2 -1.8 L-9 -1.8 L-12.4 1 L-11.2 5.2 L-15 2.6 L-18.8 5.2 L-17.6 1 L-21 -1.8 L-16.8 -1.8 Z" />
    <!-- Left Star 2 -->
    <path d="M-30 -6 L-28.2 -1.8 L-24 -1.8 L-27.4 1 L-26.2 5.2 L-30 2.6 L-33.8 5.2 L-32.6 1 L-36 -1.8 L-31.8 -1.8 Z" />
    <!-- Right Star 1 -->
    <path d="M15 -6 L16.8 -1.8 L21 -1.8 L17.6 1 L18.8 5.2 L15 2.6 L11.2 5.2 L12.4 1 L9 -1.8 L13.2 -1.8 Z" />
    <!-- Right Star 2 -->
    <path d="M30 -6 L31.8 -1.8 L36 -1.8 L32.6 1 L33.8 5.2 L30 2.6 L26.2 5.2 L27.4 1 L24 -1.8 L28.2 -1.8 Z" />
  </g>

  <!-- Typography -->
  <text x="80" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0B2545" text-anchor="middle">نماد اعتماد الکترونیکی</text>
  <text x="80" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#AA820A" text-anchor="middle">وزارت صنعت، معدن و تجارت</text>
  <text x="80" y="165" font-family="monospace" font-size="7" font-weight="500" fill="#626667" text-anchor="middle">eNamad Certified</text>
</svg>
